[package]
name = "mars"
version = "0.1.0"
edition = "2021"
description = "Redcode assembler and simulator for ICWS standards, pMARS and historical MARS.COM"
license = "MIT"
publish = false

[features]
default = ["gpu"]
# Tournaments on GPUs through wgpu (Vulkan on Linux). Build without it for a CPU-only binary.
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# The tests play hundreds of full wars, too slow without optimization.
[profile.test]
opt-level = 3
